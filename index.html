let currentDay=0, timerInterval=null, secsLeft=3600, outcomeApplied=false;

function startGame(){
  buildDays();
  showScreen('game');
  renderDots(); renderTeam(); renderResources(); renderDay(0); startClock();
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}
function startClock(){
  secsLeft=3600;
  timerInterval=setInterval(()=>{
    secsLeft--;
    const m=Math.floor(secsLeft/60),s=secsLeft%60;
    const el=document.getElementById('clock');
    if(!el){clearInterval(timerInterval);return;}
    el.textContent=m+':'+String(s).padStart(2,'0');
    el.className='clock'+(secsLeft<=300?' urgent':'');
    if(secsLeft<=0) clearInterval(timerInterval);
  },1000);
}
function renderDots(){
  const c=document.getElementById('day-dots');if(!c)return;c.innerHTML='';
  for(let i=0;i<6;i++){
    const d=document.createElement('div');
    d.className='day-dot'+(i<currentDay?' done':i===currentDay?' current':'');
    c.appendChild(d);
  }
}
function renderTeam(){
  const c=document.getElementById('team-cards');if(!c)return;c.innerHTML='';
  TEAM.forEach(m=>{
    const h=Math.max(0,m.health),mo=Math.max(0,m.morale);
    const hc=h>=70?'fill-health':h>=40?'fill-health mid':'fill-health low';
    const hcolor=h<40?'#B8003A':h<70?'#8A5800':'#00A651';
    c.innerHTML+=`<div class="member-card" style="border-left:3px solid ${m.dead?'#B8003A':m.color};${m.dead?'opacity:0.6':''}">
      ${m.dead?'<div style="text-align:center;font-size:10px;font-weight:700;color:#B8003A;letter-spacing:.05em;margin-bottom:4px;text-transform:uppercase">💀 Fallecido</div>':''}
      <div class="member-header">
        <div class="member-avatar" style="background:${m.dead?'#B8003A18':m.color+'18'}">${m.dead?'💀':m.emoji}</div>
        <div><div class="member-name">${m.name}</div><div class="member-role">${m.role}</div></div>
      </div>
      <div class="stat-row"><span class="stat-label">Salud</span><div class="stat-bar"><div class="${hc}" style="width:${h}%"></div></div><span class="stat-val" style="color:${hcolor}">${h}</span></div>
      <div class="stat-row"><span class="stat-label">Moral</span><div class="stat-bar"><div class="stat-fill fill-morale" style="width:${mo}%"></div></div><span class="stat-val" style="color:#0055A5">${mo}</span></div>
    </div>`;
  });
}
function renderResources(){
  if(!document.getElementById('resources-display'))return;
  const avgH=Math.round(TEAM.reduce((a,m)=>a+m.health,0)/TEAM.length);
  const avgM=Math.round(TEAM.reduce((a,m)=>a+m.morale,0)/TEAM.length);
  const ox=Math.max(0,100-currentDay*15),food=Math.max(0,100-currentDay*14);
  document.getElementById('resources-display').innerHTML=`
    <div class="resource-row"><span class="res-name">Salud media</span><span class="res-val ${avgH>=70?'good':avgH>=40?'warn':'bad'}">${avgH}%</span></div>
    <div class="resource-row"><span class="res-name">Moral media</span><span class="res-val ${avgM>=70?'good':avgM>=40?'warn':'bad'}">${avgM}%</span></div>
    <div class="resource-row"><span class="res-name">Oxígeno</span><span class="res-val ${ox>=50?'good':ox>=25?'warn':'bad'}">${ox}%</span></div>
    <div class="resource-row"><span class="res-name">Víveres</span><span class="res-val ${food>=50?'good':food>=25?'warn':'bad'}">${food}%</span></div>
    <div class="resource-row"><span class="res-name">Días restantes</span><span class="res-val warn">${6-currentDay}</span></div>`;
}
function renderDay(idx){
  outcomeApplied=false;
  const day=DAYS[idx];
  document.getElementById('team-marker').setAttribute('cx',day.markerX);
  document.getElementById('team-marker').setAttribute('cy',day.markerY);
  document.getElementById('marker-label').setAttribute('x',day.markerX);
  document.getElementById('marker-label').setAttribute('y',day.markerY-13);
  document.getElementById('marker-label').textContent=day.markerLabel;
  const wc=day.weather==='good'?'weather-good':day.weather==='warn'?'weather-warn':'weather-bad';
  const aliveTensions=day.tensions.filter(t=>{
    const member=TEAM.find(m=>m.role.toUpperCase()===t.role||m.name.toUpperCase()===t.role);
    return !member||!member.dead;
  });
  const tensions=aliveTensions.map(t=>`<div class="tension-item"><span class="tension-role">${t.role}</span><span>${t.text}</span></div>`).join('') || '<div class="tension-item" style="color:#888;font-style:italic">No hay tensiones — algunos miembros del equipo han fallecido.</div>';
  const outcomes=day.outcomes.map((o,i)=>`<button class="outcome-btn ${o.type}" onclick="applyOutcome(${idx},${i})"><div class="ob-label">${o.label}</div><div class="ob-text">${o.text}</div></button>`).join('');
  document.getElementById('day-content').innerHTML=`
    <div class="day-header"><div><div class="day-title">${day.title}</div></div><div class="day-meta">Altitud: ${day.altitude}</div></div>
    <div class="weather-badge ${wc}">${day.weatherLabel}</div>
    <div class="scenario-box">${day.scenario}</div>
    <div class="dilemma-box"><div class="dilemma-label">Dilema del día</div><div class="dilemma-text">${day.dilemma}</div></div>
    <div class="tensions-section"><div class="panel-label" style="margin-bottom:10px">Tensiones en el equipo</div>${tensions}</div>
    <div class="outcome-section">
      <div class="outcome-label">El equipo decide</div>
      <div class="outcomes-grid">${outcomes}</div>
      <button class="btn-next" id="btn-next" onclick="nextDay()" disabled>Avanzar al siguiente día →</button>
    </div>`;
}
function applyOutcome(di,oi){
  if(outcomeApplied)return;outcomeApplied=true;
  DAYS[di].outcomes[oi].effect();renderTeam();renderResources();
  document.getElementById('btn-next').disabled=false;
}
function nextDay(){
  currentDay++;
  if(currentDay>=6){endGame();return;}
  renderDots();renderDay(currentDay);
}
function endGame(){
  clearInterval(timerInterval);
  const dead=TEAM.filter(m=>m.dead);
  const alive=TEAM.filter(m=>!m.dead);
  const avgH=Math.round(alive.length>0?alive.reduce((a,m)=>a+m.health,0)/alive.length:0);
  const avgM=Math.round(TEAM.reduce((a,m)=>a+m.morale,0)/TEAM.length);
  const ok=dead.length===0&&avgH>=50&&avgM>=40;
  const partial=dead.length>0&&dead.length<TEAM.length;
  document.getElementById('final-title').textContent=
    dead.length===TEAM.length?'💀 Todos han muerto':
    ok?'🏔 Misión completada':
    partial?'⛰ Expedición con bajas':'⛰ Expedición terminada';
  document.getElementById('final-sub').textContent=ok
    ?`El equipo llegó a la cima y regresó completo. Un logro real de coordinación y liderazgo.`
    :dead.length===TEAM.length
    ?`Ningún miembro sobrevivió. Las decisiones del equipo agotaron completamente la salud de todos.`
    :`${dead.length} miembro${dead.length>1?'s':''} no regresó${dead.length>1?'n':''} con vida. ¿Qué decisiones lo provocaron?`;
  document.getElementById('final-scores').innerHTML=TEAM.map(m=>{
    const statusColor=m.dead?'#B8003A':m.health>=70?'#00A651':m.health>=40?'#8A5800':'#B8003A';
    const statusLabel=m.dead
      ?'Fallecido — la salud llegó a 0. Las decisiones del equipo no priorizaron su supervivencia.'
      :m.health>=70
      ?`Salud excelente (${m.health}%) — las decisiones del equipo protegieron bien a este rol.`
      :m.health>=40
      ?`Salud comprometida (${m.health}%) — sufrió consecuencias importantes pero sobrevivió.`
      :`Salud crítica (${m.health}%) — estuvo al borde. Una mala decisión más lo habría matado.`;
    const moralLabel=m.morale>=70
      ?`Moral alta (${m.morale}%) — se sintió escuchado y valorado en las decisiones del grupo.`
      :m.morale>=40
      ?`Moral media (${m.morale}%) — algunas decisiones ignoraron sus objetivos personales.`
      :`Moral baja (${m.morale}%) — el equipo no consideró sus metas. Generó tensión real.`;
    return `<div class="fscore-card" style="${m.dead?'opacity:0.75;border-top:3px solid #B8003A':''}">
      <div class="fscore-emoji">${m.dead?'💀':m.emoji}</div>
      <div class="fscore-name">${m.name}</div>
      <div class="fscore-role" style="font-size:11px;color:#888;margin-bottom:6px">${m.role}</div>
      <div class="fscore-val" style="color:${statusColor};font-size:13px;font-weight:600;margin-bottom:4px">${m.dead?'Fallecido':'Sobrevivió'}</div>
      <div style="font-size:11px;color:#666;line-height:1.4;margin-bottom:6px">${statusLabel}</div>
      ${m.dead?'':`<div style="font-size:11px;color:#666;line-height:1.4">${moralLabel}</div>`}
    </div>`;
  }).join('');
  // ── DYNAMIC DEBRIEF ──
  const lowestMorale = TEAM.reduce((a,m) => m.morale < a.morale ? m : a, TEAM[0]);
  const lowestHealth = [...TEAM].filter(m=>!m.dead).reduce((a,m) => m.health < a.health ? m : a, alive[0]||TEAM[0]);
  const sponsorLowMorale = TEAM.find(m=>m.id==='spon')?.morale < 40;
  const anyDead = dead.length > 0;
  const allDead = dead.length === TEAM.length;
  const missionSuccess = ok;

  const questions = [];

  // Always: liderazgo
  questions.push('¿Quién ejerció liderazgo real durante la expedición? ¿Coincidió con el rol asignado de &ldquo;Líder&rdquo;?');

  // Deaths → responsabilidad
  if(allDead){
    questions.push('Todos los miembros fallecieron. ¿En qué decisión específica se perdió el control de la situación?');
    questions.push('¿Hubo un momento en que el equipo debió haber dicho &ldquo;no seguimos&rdquo;? ¿Por qué no lo dijo nadie?');
  } else if(anyDead){
    const names = dead.map(m=>m.name).join(' y ');
    questions.push(`${names} no regresó${dead.length>1?'n':''} con vida. ¿Qué decisión puntual lo provocó? ¿Podría haberse evitado?`);
    questions.push('¿Cuándo el equipo priorizó la misión (cima) sobre la seguridad individual? ¿Fue la decisión correcta?');
  } else {
    questions.push('¿En qué momentos el equipo estuvo tentado a priorizar la cima por encima de la seguridad? ¿Cómo lo gestionaron?');
  }

  // Morale issues
  if(lowestMorale.morale < 30){
    questions.push(`La moral de ${lowestMorale.name} (${lowestMorale.role}) llegó a ${lowestMorale.morale}%. ¿En qué momentos el equipo ignoró sus objetivos? ¿Qué consecuencias tuvo eso?`);
  } else if(avgM < 50){
    questions.push('La moral general del equipo fue baja. ¿Qué decisiones generaron más desgaste emocional? ¿Cómo se podría haber distribuido mejor la carga?');
  }

  // Sponsor tension
  if(sponsorLowMorale){
    questions.push('El Sponsor terminó con moral muy baja. ¿Cuándo los objetivos financieros y los objetivos humanos entraron en conflicto directo? ¿Cómo lo manejan en su trabajo real?');
  }

  // Health issues in survivors
  if(!allDead && lowestHealth && lowestHealth.health < 35){
    questions.push(`${lowestHealth.name} (${lowestHealth.role}) llegó al final con ${lowestHealth.health}% de salud. ¿Hubo señales de advertencia que el equipo ignoró? ¿Por qué?`);
  }

  // Success vs failure framing
  if(missionSuccess){
    questions.push('La expedición fue exitosa. ¿Qué decisión fue la más difícil de tomar y cuál resultó ser la más importante en retrospectiva?');
    questions.push('¿Qué patrón de toma de decisiones del equipo funcionó bien aquí y podrían replicar en su trabajo diario?');
  } else if(!allDead){
    questions.push('La expedición no terminó como se planeó. ¿En qué momento se pudo haber cambiado el rumbo? ¿Quién tenía esa información?');
  }

  // Conflict & communication (always relevant)
  questions.push('¿Cómo manejaron las decisiones impopulares? ¿Quién las tomó y cómo reaccionó el equipo?');
  questions.push('¿Qué cambiarían en la forma de comunicar y decidir en su trabajo diario a partir de esta experiencia?');

  // Render debrief list (max 7 questions)
  const finalQuestions = questions.slice(0, 7);
  const dl = document.getElementById('debrief-list');
  if(dl) dl.innerHTML = finalQuestions.map(q => `<li>${q}</li>`).join('');

  showScreen('final');
}
function triggerEvent(key){
  const ev=EVENTS[key];
  document.getElementById('modal-title').textContent=ev.title;
  document.getElementById('modal-body').textContent=ev.body;
  document.getElementById('modal').classList.add('open');
  ev.effect();renderTeam();renderResources();
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function applyToAll(stat,delta){TEAM.forEach(m=>{
  if(stat==='health'&&m.dead)return;
  m[stat]=Math.min(100,m[stat]+delta);
  if(stat==='health'&&m.health<=0){m.health=0;m.dead=true;logEvent(`💀 ${m.name} (${m.role}) ha muerto en la montaña.`,'danger');}
});if(stat==='health'&&TEAM.every(m=>m.dead)){setTimeout(()=>endGame(),800);}}
function applyOne(id,stat,delta){const m=TEAM.find(t=>t.id===id);if(!m)return;
  if(stat==='health'&&m.dead)return;
  m[stat]=Math.min(100,m[stat]+delta);
  if(stat==='health'&&m.health<=0){m.health=0;m.dead=true;logEvent(`💀 ${m.name} (${m.role}) ha muerto en la montaña.`,'danger');}
  if(stat==='health'&&TEAM.every(m=>m.dead)){setTimeout(()=>endGame(),800);}
}
function logEvent(text,type=''){
  const log=document.getElementById('event-log');
  const item=document.createElement('div');
  item.className='log-item '+(type||'');
  item.innerHTML=`<span class="log-day">D${currentDay+1}</span>${text}`;
  log.prepend(item);
}
function restartGame(){
  buildDays();
  TEAM.forEach(m=>{m.health=100;m.morale=100;});
  currentDay=0;document.getElementById('event-log').innerHTML='';
  startGame();
}
    // Expose to global scope for onclick handlers
    window.startGame = startGame;
    window.restartGame = restartGame;
    window.applyOutcome = applyOutcome;
    window.nextDay = nextDay;
    window.triggerEvent = triggerEvent;
    window.closeModal = closeModal;
    window.showScreen = showScreen;
  })();
};
