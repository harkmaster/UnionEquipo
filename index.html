<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinámicas de Equipo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* RACSA brand palette */
  --racsa-navy:#002C5F;
  --racsa-blue:#0055A5;
  --racsa-green:#00A651;

  /* Surfaces */
  --bg:#F0F4FA;
  --surf:#FFFFFF;
  --s2:#E8EEF7;
  --s3:#D6E4F0;

  /* Borders */
  --bd:rgba(0,44,95,.10);
  --bd2:rgba(0,44,95,.22);

  /* Text */
  --tx:#0A1628;
  --tm:#3A5070;
  --tf:#7A90A8;

  /* Radii */
  --r:10px;--rl:16px;

  /* Category: Supervivencia (verde RACSA) */
  --cs:#00A651;--csbg:#E6F7EE;

  /* Category: Estrategia (azul RACSA) */
  --cst:#0055A5;--cstbg:#E6EEF9;

  /* Category: Negociación (ámbar) */
  --cn:#C06000;--cnbg:#FEF3E2;

  /* Category: Cultura (violeta) */
  --cc:#7B2FBE;--ccbg:#F2EAFB;

  /* Category: Ágil (carmesí) */
  --ca:#B8003A;--cabg:#FAEAEE;

  /* Category: Sistemas (teal) */
  --cy:#007B8A;--cybg:#E3F4F6;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
.screen{display:none;} .screen.active{display:block;}

/* MENU */
header{background:var(--racsa-navy);border-bottom:none;padding:2.5rem 2rem 2rem;}
.hi{max-width:1100px;margin:0 auto;}
.ey{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:10px;}
.mt{font-family:'Fraunces',serif;font-size:clamp(2.2rem,5vw,3.8rem);font-weight:600;line-height:1.05;margin-bottom:10px;color:#FFFFFF;}
.mt em{font-style:italic;font-weight:300;color:#4DD68A;}
.ms{font-size:15px;color:rgba(255,255,255,0.75);line-height:1.6;max-width:540px;margin-bottom:1.5rem;}
.ss{display:flex;gap:2rem;flex-wrap:wrap;}
.sn{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;line-height:1;color:#FFFFFF;}
.sl{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;}
.ctrl{max-width:1100px;margin:0 auto;padding:1.5rem 2rem;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surf);border-bottom:1px solid var(--bd);}
.sw{flex:1;min-width:200px;position:relative;}
.sw input{width:100%;background:var(--surf);border:1px solid var(--bd2);border-radius:var(--r);padding:10px 14px 10px 38px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--tx);outline:none;}
.sw input:focus{border-color:var(--racsa-blue);box-shadow:0 0 0 3px rgba(0,85,165,.12);}
.sw input::placeholder{color:var(--tf);}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--tf);pointer-events:none;}
.flt{display:flex;gap:6px;flex-wrap:wrap;}
.fb{background:var(--surf);border:1px solid var(--bd2);border-radius:999px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--tm);cursor:pointer;white-space:nowrap;}
.fb:hover{background:var(--s2);}
.fb.active{background:var(--racsa-blue);color:#FFF;border-color:var(--racsa-blue);}
.cl{font-size:12px;color:var(--tf);white-space:nowrap;align-self:center;margin-left:auto;}
.gw{max-width:1100px;margin:0 auto;padding:0 2rem 4rem;}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.gc{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s,border-color .25s;}
.gc:hover{box-shadow:0 8px 28px rgba(0,44,95,.14);transform:translateY(-3px);border-color:rgba(0,85,165,.25);}
.ca2{height:5px;width:100%;}
.cb{padding:18px 20px 14px;flex:1;display:flex;flex-direction:column;gap:10px;}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.cn2{font-family:'DM Mono',monospace;font-size:10px;color:var(--tf);margin-top:3px;min-width:22px;}
.ctw{flex:1;}
.ct{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--racsa-navy);line-height:1.2;margin-bottom:2px;}
.cst2{font-size:11px;color:var(--tf);}
.cc2{display:inline-flex;align-items:center;font-size:10px;font-weight:500;letter-spacing:.05em;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.cd{font-size:13px;color:var(--tm);line-height:1.55;}
.cm{display:flex;gap:8px;flex-wrap:wrap;}
.mp{font-size:11px;color:var(--tm);background:var(--s2);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;}
.ci{font-size:12px;color:var(--tm);border-left:2px solid var(--racsa-blue);padding-left:10px;line-height:1.5;font-style:italic;opacity:.85;}
.cf{padding:10px 20px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,44,95,.015);}
.mbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.mbadge.virtual{background:#E6EEF9;color:#0055A5;}
.mbadge.presencial{background:#E6F7EE;color:#00A651;}
.mbadge.mixto{background:#EEF4FF;color:#0055A5;border:1px solid rgba(0,85,165,.2);}

.pb{display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 18px;border-radius:var(--r);border:none;cursor:pointer;background:var(--racsa-green);color:#FFF;letter-spacing:.01em;}
.pb:hover{background:#008A44;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,166,81,.3);}
.cs2{color:var(--cs);background:var(--csbg);}
.cst3{color:var(--cst);background:var(--cstbg);}
.cn3{color:var(--cn);background:var(--cnbg);}
.cc3{color:var(--cc);background:var(--ccbg);}
.ca3{color:var(--ca);background:var(--cabg);}
.cy2{color:var(--cy);background:var(--cybg);}
.as{background:var(--cs);} .ast{background:var(--cst);} .an{background:var(--cn);}
.ac{background:var(--cc);} .aa{background:var(--ca);} .ay{background:var(--cy);}

/* GAME SHELL */
#gs{min-height:100vh;display:flex;flex-direction:column;}
.gtb{background:var(--racsa-navy);border-bottom:none;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;}
.bb{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:var(--r);padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;color:#FFF;}
.bb:hover{background:rgba(255,255,255,0.2);}
.gtt{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:#FFFFFF;}
#gc{flex:1;overflow-y:auto;}

/* GAME COMPONENTS */
.gwr{max-width:720px;margin:0 auto;padding:2rem 1.5rem 4rem;}
.gh{text-align:center;margin-bottom:2rem;}
.gh h2{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;margin-bottom:8px;color:var(--racsa-navy);}
.gh p{font-size:15px;color:var(--tm);line-height:1.65;max-width:520px;margin:0 auto;}
.gcard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,44,95,.06);}
.gcard h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--racsa-navy);margin-bottom:12px;opacity:.7;}
.glb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--racsa-navy);opacity:.55;margin-bottom:6px;}
.gal{background:var(--cstbg);border-left:3px solid var(--racsa-blue);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;margin-bottom:16px;font-size:14px;line-height:1.6;}
.gw2{border-left-color:var(--cn);} .gd{border-left-color:var(--ca);}
.gbtn{display:inline-flex;align-items:center;gap:8px;background:var(--racsa-blue);color:#FFF;border:none;border-radius:var(--r);padding:11px 22px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
.gbtn:hover{background:#0047A0;box-shadow:0 4px 12px rgba(0,85,165,.25);} .gbtn:disabled{opacity:.35;cursor:not-allowed;}
.gbo{background:transparent;color:var(--racsa-blue);border:1.5px solid var(--racsa-blue);}
.gbo:hover{background:var(--cstbg);}
.grow{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem;}
.gph{display:none;} .gph.active{display:block;}
.il{list-style:none;display:flex;flex-direction:column;gap:6px;}
.il li{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--s2);border-radius:var(--r);font-size:14px;cursor:pointer;border:1.5px solid transparent;}
.il li:hover{background:var(--s3);}
.il li.sel{background:#E6EEF9;border-color:var(--racsa-blue);color:var(--racsa-blue);}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem;}
.sb{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,44,95,.06);}
.sb .sbn{font-family:'Fraunces',serif;font-size:2.2rem;font-weight:600;}
.sb .sbl{font-size:11px;color:var(--tf);margin-top:4px;}
.dbl{list-style:none;display:flex;flex-direction:column;gap:8px;}
.dbl li{font-size:14px;color:var(--tm);line-height:1.55;padding-left:18px;position:relative;}
.dbl li::before{content:'›';position:absolute;left:0;color:var(--racsa-blue);font-weight:700;font-size:15px;line-height:1.35;}
.pb2{height:8px;background:var(--s2);border-radius:4px;overflow:hidden;margin-bottom:6px;}
.pf{height:100%;background:var(--racsa-green);border-radius:4px;transition:width .4s;}
.td{font-family:'DM Mono',monospace;font-size:2.5rem;text-align:center;color:var(--tx);margin:1rem 0;}
.td.urg{color:#B8003A;}
.chb{width:100%;background:var(--surf);border:1.5px solid var(--bd);border-radius:var(--r);padding:14px 16px;text-align:left;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,44,95,.05);transition:all .15s;}
.chb:hover{background:var(--cstbg);border-color:var(--racsa-blue);transform:translateX(2px);}
.chb.pg{background:#E6F7EE;border-color:#00A651;color:#006E35;}
.chb.pb3{background:#FAEAEE;border-color:#B8003A;color:#8A0028;}
.rc{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:1.5rem;}
.rcard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;border-top:3px solid var(--racsa-blue);box-shadow:0 1px 4px rgba(0,44,95,.07);}
.rcard .re{font-size:24px;margin-bottom:6px;}
.rcard .rn{font-size:14px;font-weight:600;margin-bottom:4px;}
.rcard .rg{font-size:12px;color:var(--tm);line-height:1.4;}
table.rk{width:100%;border-collapse:collapse;}
table.rk tr{border-bottom:1px solid var(--bd);}
table.rk td{padding:9px 6px;font-size:13px;}
.pl{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:500;}
.plg{background:#E6F7EE;color:#006E35;}
.plm{background:#FFF3DC;color:#8A5800;}
.plb{background:var(--cabg);color:var(--ca);}
.inf{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--tx);outline:none;margin-bottom:10px;}
.dbox{background:#FEF3E2;border-left:3px solid #C06000;border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin-bottom:16px;}
.dlb{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#C06000;font-weight:700;margin-bottom:5px;}
.ti{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--tm);line-height:1.5;}
.ti:last-child{border-bottom:none;}
.tr2{font-size:10px;font-weight:700;letter-spacing:.06em;color:#006E35;background:#E6F7EE;padding:3px 8px;border-radius:5px;white-space:nowrap;margin-top:2px;}
@media(max-width:600px){.gwr{padding:1.5rem 1rem 3rem;}.sgrid{grid-template-columns:1fr 1fr;}}

*:focus-visible{outline:2px solid var(--racsa-blue);outline-offset:2px;border-radius:4px;}
</style>
</head>
<body>
<div class="screen active" id="ms">
  <header>
    <div class="hi">
      <div class="ey" style="display:flex;align-items:center;gap:10px">
      <svg width="72" height="18" viewBox="0 0 72 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="72" height="18" rx="3" fill="rgba(255,255,255,0.15)"/>
        <text x="6" y="13" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="2">RACSA</text>
      </svg>
      <span>Biblioteca de dinámicas · Desarrollo organizacional</span>
    </div>
      <h1 class="mt">Dinámicas de <em>equipo</em></h1>
      <p class="ms">30 simulaciones interactivas para desarrollar liderazgo, comunicación y pensamiento estratégico.</p>
      <div class="ss">
        <div><div class="sn">30</div><div class="sl">Dinámicas</div></div>
        <div><div class="sn">6</div><div class="sl">Categorías</div></div>
        <div><div class="sn">30</div><div class="sl">Disponibles</div></div>
      </div>
    </div>
  </header>
  <div class="ctrl">
    <div class="sw"><span class="si" style="color:var(--tf);display:flex;align-items:center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><input type="text" id="srch" placeholder="Buscar dinámica..." oninput="af()"></div>
    <div class="flt">
      <button class="fb active" onclick="sf('all',this)">Todas</button>
      <button class="fb" onclick="sf('survival',this)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0"><rect width="16" height="16" rx="4" fill="#00A651"/><path d="M8 3L13 13H3L8 3Z" fill="white" opacity="0.9"/><path d="M5.5 13L8 8.5L10.5 13" fill="white" opacity="0.5"/><circle cx="11" cy="5" r="1.5" fill="white" opacity="0.8"/></svg> Supervivencia</button>
      <button class="fb" onclick="sf('strategy',this)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0"><rect width="16" height="16" rx="4" fill="#0055A5"/><rect x="6" y="3" width="4" height="2" rx="1" fill="white"/><rect x="7" y="5" width="2" height="4" fill="white"/><rect x="5" y="9" width="6" height="2" rx="1" fill="white" opacity="0.9"/><rect x="5.5" y="11" width="5" height="2" rx="1" fill="white" opacity="0.7"/></svg> Estrategia</button>
      <button class="fb" onclick="sf('negotiation',this)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0"><rect width="16" height="16" rx="4" fill="#C06000"/><path d="M3 8.5L6 6H8L10 7H13L13 9.5L10.5 11H8L6 10L3 11V8.5Z" fill="white" opacity="0.85"/><path d="M8 7L10 7" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/></svg> Negociación</button>
      <button class="fb" onclick="sf('culture',this)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0"><rect width="16" height="16" rx="4" fill="#7B2FBE"/><circle cx="8" cy="8" r="5" stroke="white" stroke-width="1.5" fill="none"/><path d="M3 8H13" stroke="white" stroke-width="1"/><path d="M8 3C6.5 5 6.5 11 8 13" stroke="white" stroke-width="1"/><path d="M8 3C9.5 5 9.5 11 8 13" stroke="white" stroke-width="1"/></svg> Cultura</button>
      <button class="fb" onclick="sf('agile',this)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0"><rect width="16" height="16" rx="4" fill="#B8003A"/><path d="M9 3L5 9H8.5L7 13L11 7H7.5L9 3Z" fill="white"/></svg> Ágil</button>
      <button class="fb" onclick="sf('systems',this)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0"><rect width="16" height="16" rx="4" fill="#007B8A"/><circle cx="8" cy="8" r="2.5" fill="white"/><path d="M8 3v1.5M8 11.5V13M3 8h1.5M11.5 8H13M4.6 4.6l1.1 1.1M10.3 10.3l1.1 1.1M4.6 11.4l1.1-1.1M10.3 5.7l1.1-1.1" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg> Sistemas</button>
    </div>
    <span class="cl" id="cl">30 dinámicas</span>
  </div>
  <div class="gw"><div class="gg" id="grid"></div></div>
</div>
<div class="screen" id="gs">
  <div class="gtb" id="gtb" style="display:none"></div>
  <div id="gc"></div>
</div>
<script>
const GAMES=[
  {n:1,id:'everest',t:'Everest',s:'Expedición · Nepal',cat:'survival',cl:'Supervivencia',p:'5',d:'60 min',desc:'Gestión de equipo multidisciplinario para alcanzar la cima en 6 días simulados equilibrando metas individuales, salud y climatología.',ins:'El éxito requiere comunicación constante y priorizar la supervivencia del grupo.',v:'mixto'},
  {n:2,id:'samurai',t:'The Samurai Game',s:'Combate simulado · Japón',cat:'survival',cl:'Supervivencia',p:'10–50',d:'90 min',desc:'Simulación de combate feudal que explora liderazgo, ética y consecuencias de la indecisión bajo presión extrema.',ins:'La indecisión tiene consecuencias tan graves como la decisión equivocada.',v:'presencial'},
  {n:3,id:'freshbiz',t:'FreshBiz',s:'Tablero financiero · Israel',cat:'strategy',cl:'Estrategia',p:'4–6',d:'90 min',desc:'Tablero donde equipos compiten y colaboran en un ecosistema financiero. El pensamiento ganar-ganar supera la competencia pura.',ins:'La colaboración entre competidores genera mayor valor que la rivalidad.',v:'presencial'},
  {n:4,id:'beer',t:'Beer Distribution',s:'Cadena de suministro · MIT',cat:'systems',cl:'Sistemas',p:'4–8',d:'60 min',desc:'Cada jugador gestiona un eslabón de la cadena. La mala comunicación crea el efecto látigo: pequeñas variaciones producen caos aguas arriba.',ins:'Los sistemas se optimizan localmente a costa del sistema total.',v:'mixto'},
  {n:5,id:'bafabafa',t:"BaFá BaFá",s:'Intercambio cultural · EE.UU.',cat:'culture',cl:'Cultura',p:'12–40',d:'120 min',desc:'Dos culturas ficticias intercambian embajadores. Los participantes experimentan el choque cultural y los prejuicios automáticos en carne propia.',ins:'Los juicios precipitados sobre otras culturas son inevitables sin inmersión real.',v:'presencial'},
  {n:6,id:'friday',t:'Friday Night at the ER',s:'Simulación hospitalaria',cat:'systems',cl:'Sistemas',p:'4',d:'120 min',desc:'Cuatro equipos gestionan un hospital durante una noche de urgencias. Cada decisión afecta a todos los demás departamentos.',ins:'La optimización de una sola área puede colapsar todo el sistema.',v:'presencial'},
  {n:7,id:'desert',t:'Desert Survival',s:'Accidente en el desierto',cat:'survival',cl:'Supervivencia',p:'4–8',d:'60 min',desc:'El avión se estrelló en el desierto de Sonora. Quedan 15 objetos. El equipo los prioriza individual y colectivamente.',ins:'La sinergia grupal casi siempre supera al mejor individuo del equipo.',v:'mixto'},

function goMenu(){if(typeof timerInterval!=='undefined')clearInterval(timerInterval);if(typeof pgTi!=='undefined')clearInterval(pgTi);if(typeof bfTi!=='undefined')clearInterval(bfTi);document.getElementById('ms').classList.add('active');document.getElementById('gs').classList.remove('active');document.getElementById('gc').innerHTML='';}
function launch(id,title){
  document.getElementById('ms').classList.remove('active');document.getElementById('gs').classList.add('active');
  const gtb=document.getElementById('gtb');
  if(id==='everest'){
    gtb.style.display='none';gtb.innerHTML='';
  } else {
    gtb.style.display='flex';
    gtb.innerHTML=`<button class="bb" onclick="goMenu()"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Menú</button><span class="gtt">${title}</span>`;
  }
  const fn=window['G_'+id];
  if(fn)fn();else document.getElementById('gc').innerHTML=`<div class="gwr"><div class="gh"><h2>${title}</h2><p style="color:var(--ca)">Próximamente.</p></div></div>`;
}
function gc2(){return document.getElementById('gc');}
function debrf(el,qs){el.innerHTML+=`<div class="gcard"><h3>Preguntas de debriefing</h3><ul class="dbl">${qs.map(q=>`<li>${q}</li>`).join('')}</ul></div><div class="grow"><button class="gbtn" onclick="goMenu()"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Volver al menú</button></div>`;}
// ── SURVIVAL TEMPLATE ──
function survivalGame(cfg){
  let iSel=[],tSel=[],ph=0,secs=cfg.secs||600,ti=null;
  function render(){ph===0?rIntro():ph===1?rInd():ph===2?rTeam():rRes();}
  function rIntro(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${cfg.title}</h2><p>${cfg.intro}</p></div>
    <div class="gal gw2"><strong>Situación:</strong> ${cfg.sit}</div>
    <div class="gcard"><h3>Cómo funciona</h3><ul class="dbl">
      <li>Ronda individual: elegí los ${cfg.pick} objetos más importantes sin consultar a nadie.</li>
      <li>Ronda de equipo: discutan por consenso en ${Math.round(cfg.secs/60)} minutos.</li>
      <li>Resultados: comparen con expertos.</li>
    </ul></div>
    <div class="grow"><button class="gbtn" onclick="sph(1)">Comenzar →</button></div>`;
    window.sph=p=>{ph=p;render();};
  }
  function grid(sel,max,fn){
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem">${cfg.items.map(it=>{
      const s=sel.includes(it.id),lk=!s&&sel.length>=max;
      return`<div onclick="${fn}T(${it.id})" style="background:${s?'#E6EEF9':'var(--surf)'};border:${s?'2px solid #0055A5':'1px solid var(--bd)'};;border-radius:var(--r);padding:10px 12px;cursor:${lk?'not-allowed':'pointer'};opacity:${lk?.45:1};display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">${it.icon}</span>
        <div><div style="font-size:13px;font-weight:500;color:${s?'#0055A5':'var(--tx)'}">${it.name}</div><div style="font-size:11px;color:var(--tf)">${it.desc}</div></div>
        ${s?'<span style="margin-left:auto;color:var(--cs)">✓</span>':''}
      </div>`;}).join('')}</div>`;
  }
  function rInd(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Ronda individual</h2><p>Elegí los <strong>${cfg.pick} objetos</strong> más importantes. No consultes a nadie.</p></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="font-size:13px;color:var(--tm)">Seleccionados</span>
    <span id="ic" style="background:var(--csbg);color:var(--cs);font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px">${iSel.length}/${cfg.pick}</span></div>
    ${grid(iSel,cfg.pick,'ind')}
    <button class="gbtn" id="ib" onclick="sph(2)" ${iSel.length!==cfg.pick?'disabled':''}>Pasar a ronda de equipo →</button>`;
    window.indT=id=>{const i=iSel.indexOf(id);i>-1?iSel.splice(i,1):(iSel.length<cfg.pick&&iSel.push(id));rInd();};
  }
  function rTeam(){
    secs=cfg.secs||600;const tot=secs;
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Ronda de equipo</h2><p>Elijan los <strong>${cfg.pick} objetos</strong> por consenso.</p></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:13px;color:var(--tm)">Tiempo</span>
    <span id="tmr" class="td" style="font-size:1.8rem;margin:0">${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</span></div>
    <div class="pb2"><div class="pf" id="tf2" style="width:100%"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0">
    <span style="font-size:13px;color:var(--tm)">Seleccionados</span>
    <span id="tc" style="background:var(--csbg);color:var(--cs);font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px">${tSel.length}/${cfg.pick}</span></div>
    ${grid(tSel,cfg.pick,'team')}
    <div class="grow"><button class="gbtn" id="tb" onclick="sph(3)" ${tSel.length!==cfg.pick?'disabled':''}>Ver resultados →</button>
    <button class="gbtn gbo" onclick="clearInterval(ti)">⏸ Pausar</button></div>`;
    ti=setInterval(()=>{secs--;const t=document.getElementById('tmr'),f=document.getElementById('tf2');if(!t){clearInterval(ti);return;}
      t.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
      t.className='td'+(secs<=60?' urg':'');if(f)f.style.width=Math.round(secs/tot*100)+'%';
      if(secs<=0)clearInterval(ti);},1000);
    window.teamT=id=>{const i=tSel.indexOf(id);i>-1?tSel.splice(i,1):(tSel.length<cfg.pick&&tSel.push(id));
      const c=document.getElementById('tc'),b=document.getElementById('tb');
      if(c)c.textContent=`${tSel.length}/${cfg.pick}`;if(b)b.disabled=tSel.length!==cfg.pick;
      const gr=gc2().querySelector('.gwr > div:nth-of-type(4)');if(gr)gr.outerHTML=grid(tSel,cfg.pick,'team');rTeam();};
  }
  function rRes(){
    clearInterval(ti);
    const top=cfg.expert.slice(0,cfg.pick).map(e=>e.id);
    function sc(sel){return sel.reduce((a,id)=>{const r=cfg.expert.find(e=>e.id===id)?.rank??cfg.items.length;return a+(r<=cfg.pick?2:r<=cfg.pick*2?1:0);},0);}
    const is=sc(iSel),ts=sc(tSel),mx=cfg.pick*2;
    const col=v=>v>=mx*.7?'var(--cs)':v>=mx*.4?'var(--cn)':'var(--ca)';
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Resultados</h2></div>
    <div class="sgrid">
      <div class="sb"><div class="sbn" style="color:${col(is)}">${is}/${mx}</div><div class="sbl">Tu puntaje</div></div>
      <div class="sb" style="${ts>is?'border:2px solid var(--cs)':''}"><div class="sbn" style="color:${col(ts)}">${ts}/${mx}</div><div class="sbl">Equipo</div></div>
      <div class="sb"><div class="sbn">${ts>is?'🏆':'🤔'}</div><div class="sbl">${ts>is?'Equipo ganó':'Revisá'}</div></div>
    </div>
    <div class="gcard"><h3>Ranking de expertos</h3>
    <table class="rk">${cfg.expert.map(e=>{const it=cfg.items.find(i=>i.id===e.id);const cls=e.rank<=cfg.pick?'plg':e.rank<=cfg.pick*2?'plm':'plb';const lbl=e.rank<=cfg.pick?'Esencial':e.rank<=cfg.pick*2?'Útil':'Prescindible';
      return`<tr><td style="color:var(--tf);font-family:'DM Mono',monospace;font-size:10px;width:20px">${e.rank}</td><td>${it.icon} ${it.name}</td><td><span class="pl ${cls}">${lbl}</span></td></tr>`;}).join('')}</table></div>
    <div class="gcard"><h3>Tu selección</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${iSel.map(id=>{const it=cfg.items.find(i=>i.id===id);return`<span class="pl ${top.includes(id)?'plg':'plb'}">${it.icon} ${it.name}</span>`;}).join('')}</div></div>
    <div class="gcard"><h3>Selección del equipo</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${tSel.map(id=>{const it=cfg.items.find(i=>i.id===id);return`<span class="pl ${top.includes(id)?'plg':'plb'}">${it.icon} ${it.name}</span>`;}).join('')}</div></div>`;
    debrf(gc2(),cfg.debrf);
  }
  render();
}

// ── DILEMMA TEMPLATE ──
function dilemmaGame(cfg){
  let step=0,score=0,choices=[];
  function render(){step===0?rIntro():step<=cfg.scenarios.length?rScenario(step-1):rEnd();}
  function rIntro(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${cfg.title}</h2><p>${cfg.intro}</p></div>
    <div class="gal">${cfg.context}</div>
    ${cfg.roles?`<div class="rc">${cfg.roles.map(r=>`<div class="rcard" style="border-top-color:${r.color}"><div class="re">${r.e}</div><div class="rn">${r.name}</div><div class="rg">${r.goal}</div></div>`).join('')}</div>`:''}
    <div class="grow"><button class="gbtn" onclick="dN()">Comenzar →</button></div>`;
    window.dN=()=>{step++;render();};
  }
  function rScenario(i){
    const s=cfg.scenarios[i];
    gc2().innerHTML=`<div class="gwr">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div class="glb">Escenario ${i+1}/${cfg.scenarios.length}</div>
      <div class="pb2" style="width:200px;margin-bottom:0"><div class="pf" style="width:${Math.round(i/cfg.scenarios.length*100)}%"></div></div>
    </div>
    <div class="gh" style="text-align:left;margin-bottom:1rem"><h2 style="font-size:1.4rem">${s.title}</h2></div>
    <div class="gal gw2">${s.sit}</div>
    ${s.ten?`<div class="dbox"><div class="dlb">Tensión</div><div style="font-size:14px">${s.ten}</div></div>`:''}
    <div class="glb" style="margin-bottom:10px">¿Qué decide el equipo?</div>
    ${s.choices.map((c,ci)=>`<button class="chb" onclick="dC(${i},${ci})">${c.l}<br><span style="font-size:12px;color:var(--tf)">${c.h}</span></button>`).join('')}`;
    window.dC=(si,ci)=>{const c=cfg.scenarios[si].choices[ci];score+=(c.pts||0);choices.push({scenario:cfg.scenarios[si].title,choice:c.l,fb:c.fb,good:c.good});step++;render();};
  }
  function rEnd(){
    const mx=cfg.scenarios.reduce((a,s)=>a+Math.max(...s.choices.map(c=>c.pts||0)),0);
    const pct=mx>0?Math.round(score/mx*100):50;
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Simulación completada</h2></div>
    <div class="sgrid">
      <div class="sb"><div class="sbn" style="color:${pct>=70?'#00A651':pct>=40?'#C06000':'#B8003A'}">${score}</div><div class="sbl">Puntos</div></div>
      <div class="sb"><div class="sbn">${pct}%</div><div class="sbl">Efectividad</div></div>
      <div class="sb"><div class="sbn">${pct>=70?'🏆':pct>=40?'📊':'🔄'}</div><div class="sbl">${pct>=70?'Excelente':pct>=40?'Aceptable':'Revisar'}</div></div>
    </div>
    <div class="gcard"><h3>Decisiones tomadas</h3>
    ${choices.map(c=>`<div style="padding:10px 0;border-bottom:1px solid var(--bd)">
      <div style="font-size:11px;color:var(--tf)">${c.scenario}</div>
      <div style="font-size:13px;font-weight:500;color:${c.good?'var(--cs)':'var(--ca)'}">${c.choice}</div>
      <div style="font-size:12px;color:var(--tm);margin-top:3px">${c.fb}</div>
    </div>`).join('')}</div>`;
    debrf(gc2(),cfg.debrf);
  }
  render();
}

// ── BUSINESS STRATEGY TEMPLATE ──
function bizGame(cfg){
  let period=0,R={cash:100,share:25,brand:50},choices=[];
  function render(){period===0?rIntro():period<=cfg.periods.length?rPeriod(period-1):rEnd();}
  function rIntro(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${cfg.title}</h2><p>${cfg.intro}</p></div>
    <div class="gcard"><h3>Estado inicial</h3><div class="sgrid">
      <div class="sb"><div class="sbn">${R.cash}</div><div class="sbl">💰 Capital (M$)</div></div>
      <div class="sb"><div class="sbn">${R.share}%</div><div class="sbl">📊 Cuota de mercado</div></div>
      <div class="sb"><div class="sbn">${R.brand}</div><div class="sbl">⭐ Brand equity</div></div>
    </div></div>
    <div class="grow"><button class="gbtn" onclick="bN()">Comenzar →</button></div>`;
    window.bN=()=>{period++;render();};
  }
  function rPeriod(i){
    const p=cfg.periods[i];
    gc2().innerHTML=`<div class="gwr">
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
      <div class="glb">Período ${i+1}/${cfg.periods.length}: ${p.title}</div>
      <div style="display:flex;gap:8px">
        <span class="mp">💰 ${R.cash}M</span><span class="mp">📊 ${R.share}%</span><span class="mp">⭐ ${R.brand}</span>
      </div>
    </div>
    <div class="gal gw2">${p.sit}</div>
    ${p.ev?`<div class="dbox"><div class="dlb">Evento del mercado</div><div style="font-size:14px">${p.ev}</div></div>`:''}
    <div class="glb" style="margin-bottom:10px">Decisión estratégica</div>
    ${p.choices.map((c,ci)=>`<button class="chb" onclick="bC(${i},${ci})">${c.l}<br><span style="font-size:12px;color:var(--tf)">${c.h}</span></button>`).join('')}`;
    window.bC=(pi,ci)=>{
      const c=cfg.periods[pi].choices[ci];
      R.cash=Math.max(0,R.cash+(c.cash||0));R.share=Math.max(0,Math.min(100,R.share+(c.share||0)));R.brand=Math.max(0,Math.min(100,R.brand+(c.brand||0)));
      choices.push({period:cfg.periods[pi].title,choice:c.l,fb:c.fb,good:c.good,cash:c.cash||0,share:c.share||0,brand:c.brand||0});
      period++;render();
    };
  }
  function rEnd(){
    const ok=R.share>=28&&R.cash>=40&&R.brand>=45;
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${ok?'🏆 Empresa líder':'📉 Empresa en reestructuración'}</h2></div>
    <div class="sgrid">
      <div class="sb"><div class="sbn" style="color:${R.cash>=60?'#00A651':R.cash>=30?'#C06000':'#B8003A'}">${R.cash}M</div><div class="sbl">💰 Capital</div></div>
      <div class="sb"><div class="sbn" style="color:${R.share>=30?'#00A651':R.share>=18?'#C06000':'#B8003A'}">${R.share}%</div><div class="sbl">📊 Cuota</div></div>
      <div class="sb"><div class="sbn" style="color:${R.brand>=55?'#00A651':R.brand>=30?'#C06000':'#B8003A'}">${R.brand}</div><div class="sbl">⭐ Brand</div></div>
    </div>
    <div class="gcard"><h3>Historial</h3>${choices.map(c=>`<div style="padding:9px 0;border-bottom:1px solid var(--bd)">
      <div style="font-size:11px;color:var(--tf)">${c.period}</div>
      <div style="font-size:13px;font-weight:500;color:${c.good?'var(--cs)':'var(--ca)'}">${c.choice}</div>
      <div style="font-size:11px;color:var(--tm)">${c.fb}</div>
      <div style="font-size:11px;color:var(--tf);margin-top:2px">💰${c.cash>0?'+':''}${c.cash}M · 📊${c.share>0?'+':''}${c.share}% · ⭐${c.brand>0?'+':''}${c.brand}</div>
    </div>`).join('')}</div>`;
    debrf(gc2(),cfg.debrf);
  }
  render();
}

// ── PRISONER'S DILEMMA ──
window.G_prisoner=function(){
  let rnd=0,tot=8,mySc=0,oppSc=0,hist=[];
  function opp(){return rnd===0?'C':hist[hist.length-1].me==='D'?'D':'C';}
  function render(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Prisoner's Dilemma</h2><p>Ronda ${rnd+1}/${tot}. Elegí sin saber el movimiento del oponente.</p></div>
    <div class="sgrid">
      <div class="sb"><div class="sbn" style="color:#00A651">${mySc}</div><div class="sbl">Tu puntaje</div></div>
      <div class="sb"><div class="sbn" style="color:#B8003A">${oppSc}</div><div class="sbl">Oponente</div></div>
      <div class="sb"><div class="sbn">${tot-rnd}</div><div class="sbl">Rondas restantes</div></div>
    </div>
    <div class="gcard"><h3>Matriz de pagos</h3>
    <table style="width:100%;text-align:center;font-size:13px;border-collapse:collapse">
      <tr><td></td><td style="padding:6px;color:var(--cs);font-weight:600">Oponente coopera</td><td style="padding:6px;color:var(--ca);font-weight:600">Oponente traiciona</td></tr>
      <tr><td style="padding:6px;font-weight:600;color:var(--cs)">Vos cooperás</td><td style="background:var(--csbg);padding:8px;border-radius:6px">Vos 3 / Opp 3</td><td style="background:var(--cabg);padding:8px;border-radius:6px">Vos 0 / Opp 5</td></tr>
      <tr><td style="padding:6px;font-weight:600;color:var(--ca)">Vos traicionás</td><td style="background:var(--cabg);padding:8px;border-radius:6px">Vos 5 / Opp 0</td><td style="background:var(--s2);padding:8px;border-radius:6px">Vos 1 / Opp 1</td></tr>
    </table></div>
    ${hist.length>0?`<div class="gcard"><h3>Historial</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${hist.map((h,i)=>`<div style="background:${h.me==='C'&&h.opp==='C'?'var(--csbg)':h.me==='D'&&h.opp==='D'?'var(--cabg)':'#FFF3DC'};border-radius:6px;padding:6px 10px;font-size:11px;text-align:center"><div>R${i+1}</div><div>Vos:${h.me==='C'?'✅':'❌'}</div><div>Opp:${h.opp==='C'?'✅':'❌'}</div></div>`).join('')}</div></div>`:''}
    <div class="grow">
      <button class="gbtn" style="background:var(--cs);flex:1" onclick="pdM('C')">✅ Cooperar</button>
      <button class="gbtn" style="background:var(--ca);flex:1" onclick="pdM('D')">❌ Traicionar</button>
    </div>`;
    window.pdM=me=>{
      const o=opp();const pay={CC:{me:3,opp:3},CD:{me:0,opp:5},DC:{me:5,opp:0},DD:{me:1,opp:1}};
      mySc+=pay[me+o].me;oppSc+=pay[me+o].opp;hist.push({me,opp:o});rnd++;
      if(rnd>=tot){
        gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${mySc>=oppSc?'🏆 Ganaste':'🤔 Perdiste'}</h2>
        <p>El oponente usaba <strong>Tit for Tat</strong>: cooperó primero y luego imitó tu movimiento anterior.</p></div>
        <div class="sgrid">
          <div class="sb"><div class="sbn" style="color:${mySc>=oppSc?'var(--cs)':'var(--ca)'}">${mySc}</div><div class="sbl">Tu puntaje</div></div>
          <div class="sb"><div class="sbn">${oppSc}</div><div class="sbl">Oponente</div></div>
          <div class="sb"><div class="sbn">${Math.round(hist.filter(h=>h.me==='C').length/tot*100)}%</div><div class="sbl">% cooperación</div></div>
        </div>`;
        debrf(gc2(),['¿En qué ronda cambió la estrategia?','¿Cómo influye el horizonte de tiempo en la decisión de cooperar?','¿Identifican situaciones similares en su trabajo?','¿Qué aprendieron sobre confianza y reciprocidad?']);
      }else render();
    };
  }
  render();
};

      <button class="gbtn" style="background:var(--cst);flex:1" onclick="rbM('blue')">🔵 Azul</button>
    </div>`;

      <div class="sb"><div class="sbn" style="color:${comb>=max*.7?'var(--cs)':'var(--ca)'}">${comb}</div><div class="sbl">Total</div></div>
    </div>`;
    debrf(gc2(),['¿Cuándo intentaron comunicarse con el Equipo B?','¿Qué tan fácil fue confiar en el otro equipo?','¿Identifican dinámicas similares entre departamentos?','¿Cómo cambia la estrategia cuando el objetivo es el total combinado?']);

};

function dutchmanGame(){
  let rnd=0,tot=6,aG=0,bG=0,hist=[],stability=100;
  function render(){
    if(rnd===0){
      gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Lost Dutchman's Gold</h2><p>Dos equipos compiten por extraer oro de la misma mina. Los recursos son compartidos. ¿Competencia o colaboración?</p></div>
      <div class="gal gw2">La mina tiene capacidad limitada. Si ambos equipos extraen agresivamente, el rendimiento cae para todos.</div>
      <div class="gcard"><h3>Reglas</h3><ul class="dbl">
        <li><strong>Agresivo:</strong> 30 oro, −20 suministros. Si ambos eligen agresivo, la mina pierde estabilidad y el rendimiento cae.</li>
        <li><strong>Moderado:</strong> 15 oro, −10 suministros. Preserva la mina.</li>
        <li>Gana el equipo con más oro, o ambos si superan 150 oro combinado.</li>
      </ul></div>
      <div class="grow"><button class="gbtn" onclick="ldN()">Comenzar →</button></div>`;
      window.ldN=()=>{rnd=1;render();};return;
    }
    if(rnd>tot){
      const total=aG+bG;
      gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${total>=150?'🏆 Meta colaborativa alcanzada':'⚖️ La competencia limitó el resultado'}</h2>
      <p>Oro total: ${total} de 180 posibles con colaboración plena.</p></div>
      <div class="sgrid">
        <div class="sb"><div class="sbn" style="color:var(--cn)">${aG}</div><div class="sbl">🏅 Equipo A</div></div>
        <div class="sb"><div class="sbn" style="color:var(--cn)">${bG}</div><div class="sbl">🏅 Equipo B</div></div>
        <div class="sb"><div class="sbn" style="color:${total>=150?'var(--cs)':'var(--ca)'}">${total}</div><div class="sbl">Total</div></div>
      </div>`;
      debrf(gc2(),['¿Cuándo decidieron colaborar o competir?','¿Qué tan difícil fue confiar en que el otro equipo mantendría el acuerdo?','¿Esto refleja dinámicas entre departamentos en su organización?']);
      return;
    }
    gc2().innerHTML=`<div class="gwr"><div class="glb">Ronda ${rnd}/${tot} — Estabilidad de la mina: ${stability}%</div>
    <div class="pb2"><div class="pf" style="width:${stability}%;background:${stability>60?'var(--cs)':stability>30?'var(--cn)':'var(--ca)'}"></div></div>
    <div class="sgrid">
      <div class="sb"><div class="sbn" style="color:var(--cn)">${aG}</div><div class="sbl">🪙 Equipo A</div></div>
      <div class="sb"><div class="sbn" style="color:var(--cn)">${bG}</div><div class="sbl">🪙 Equipo B</div></div>
      <div class="sb"><div class="sbn">${aG+bG}</div><div class="sbl">Total</div></div>
    </div>
    <div class="glb" style="margin-bottom:10px">Estrategia de Equipo A esta ronda:</div>
    <button class="chb" onclick="ldC('a')">⚒️ Extracción agresiva — 30 oro, −20 suministros<br><span style="font-size:12px;color:var(--tf)">Mayor ganancia individual, mayor impacto en la mina</span></button>
    <button class="chb" onclick="ldC('m')">🌿 Extracción moderada — 15 oro, −10 suministros<br><span style="font-size:12px;color:var(--tf)">Menor ganancia pero preserva la mina para todos</span></button>`;
    window.ldC=stratA=>{
      const stratB=stability>50?'m':'a';
      const both=stratA==='a'&&stratB==='a';
      const mult=both?0.6:stability/100;
      aG+=Math.round((stratA==='a'?30:15)*mult);bG+=Math.round((stratB==='a'?30:15)*mult);
      if(both)stability=Math.max(0,stability-20);
      hist.push({stratA,stratB,both});rnd++;render();
    };
  }
  render();
}

      <div class="gal ${opt?'':'gw2'}">${fb[decision]}</div>`;
      debrf(gc2(),['¿Cuánta información fue compartida voluntariamente?','¿Qué información resultó más crítica y por qué fue retenida?','¿Cómo afecta el rol de cada persona a qué información comparte?','¿Qué proceso de decisión implementarían en su organización?']);
      return;

    gc2().innerHTML=`<div class="gwr"><div class="glb">Fase ${step}/${phases.length}</div>
    <div class="gh" style="text-align:left;margin-bottom:1rem"><h2 style="font-size:1.4rem">${phases[step-1]}</h2></div>

    ${roles.map(r=>`<label style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer">
      <input type="checkbox" onchange="sdSh('${r.r}',this.checked)" ${shared.includes(r.r)?'checked':''} style="width:16px;height:16px">
      <div><div style="font-size:13px;font-weight:600">${r.e} ${r.r}</div><div style="font-size:12px;color:var(--tm)">${r.key}</div></div>

function physGame(cfg){
  let ph=0,secs=cfg.secs||1200,ti=null;
  function render(){
    if(ph===0){
      gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${cfg.title}</h2><p>${cfg.intro}</p></div>
      ${cfg.materials?`<div class="gcard"><h3>Materiales</h3><ul class="dbl">${cfg.materials.map(m=>`<li>${m}</li>`).join('')}</ul></div>`:''}
      <div class="gcard"><h3>Instrucciones</h3><ol style="padding-left:1.2rem;display:flex;flex-direction:column;gap:8px">${cfg.steps.map(s=>`<li style="font-size:14px;color:var(--tm);line-height:1.5">${s}</li>`).join('')}</ol></div>
      <div class="grow"><button class="gbtn" onclick="pgS()">Iniciar actividad →</button></div>`;
      window.pgS=()=>{ph=1;render();};return;
    }
    if(ph===1){
      const tot=secs;
      gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>En progreso</h2><p>${cfg.note||'El facilitador guía la actividad presencial.'}</p></div>
      <div class="td" id="pgt">${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div>
      <div class="pb2"><div class="pf" id="pgf" style="width:100%"></div></div>
      ${cfg.fnotes?`<div class="gcard"><h3>Notas para el facilitador</h3><ul class="dbl">${cfg.fnotes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`:''}
      <div class="grow">
        <button class="gbtn" onclick="pgEnd()">Actividad completada →</button>
        <button class="gbtn gbo" onclick="clearInterval(pgTi)">⏸ Pausar</button>
      </div>`;
      window.pgTi=ti=setInterval(()=>{secs--;const t=document.getElementById('pgt'),f=document.getElementById('pgf');if(!t){clearInterval(ti);return;}
        t.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
        t.className='td'+(secs<=60?' urg':'');if(f)f.style.width=Math.round(secs/tot*100)+'%';if(secs<=0)clearInterval(ti);},1000);
      window.pgEnd=()=>{clearInterval(ti);ph=2;render();};return;
    }
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>✅ Actividad completada</h2></div>
    ${cfg.vars?`<div class="gcard"><h3>Variaciones para próximas sesiones</h3><ul class="dbl">${cfg.vars.map(v=>`<li>${v}</li>`).join('')}</ul></div>`:''}`;
    debrf(gc2(),cfg.debrf);
  }
  render();
}

window.G_shogi=function(){
  let cells=Array(5).fill(null).map(()=>Array(5).fill(null));
  let turn='b',cap={b:[],w:[]},sel=null;
  const lbl={king:'王',rook:'飛',bishop:'角',gold:'金',silver:'銀',pawn:'歩'};
  cells[0]=['w-king','w-rook','w-bishop','w-gold','w-silver'];
  cells[1]=[null,'w-pawn',null,'w-pawn',null];
  cells[3]=[null,'b-pawn',null,'b-pawn',null];
  cells[4]=['b-silver','b-gold','b-bishop','b-rook','b-king'];
  function render(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Shogi Gerencial</h2><p>Tablero 5×5. ${turn==='b'?'⚫ Negro':'⚪ Blanco'} juega. Las piezas capturadas se pueden reutilizar.</p></div>
    <div style="max-width:320px;margin:0 auto 1.5rem">
      <div style="font-size:12px;margin-bottom:8px">Capturas ⚫: ${cap.b.map(p=>`<span>${lbl[p.split('-')[1]]||'?'}</span>`).join(' ')||'—'}</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--s3);padding:3px;border-radius:var(--r)">
        ${cells.map((row,r)=>row.map((c,col)=>{const isSel=sel&&sel[0]===r&&sel[1]===col;return`<div onclick="shoC(${r},${col})" style="background:${isSel?'var(--csbg)':c?'var(--surf)':'#DEB88799'};aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:${isSel?'2px solid var(--cs)':'1px solid rgba(0,0,0,0.1)'};font-size:11px;color:${c&&c[0]==='b'?'#1C1710':'#666'}">${c?lbl[c.split('-')[1]]||'?':''}</div>`;}).join('')).join('')}
      </div>
      <div style="font-size:12px;margin-top:8px">Capturas ⚪: ${cap.w.map(p=>`<span>${lbl[p.split('-')[1]]||'?'}</span>`).join(' ')||'—'}</div>
    </div>
    <div class="gcard"><h3>Principio clave</h3><p style="font-size:14px;color:var(--tm);line-height:1.6">Las piezas capturadas NO se eliminan — el captor puede colocarlas de su lado. <strong>Metáfora de la reubicación estratégica de talento.</strong></p></div>
    <div class="grow">
      <button class="gbtn gbo" onclick="cells=Array(5).fill(null).map(()=>Array(5).fill(null));turn='b';cap={b:[],w:[]};sel=null;cells[0]=['w-king','w-rook','w-bishop','w-gold','w-silver'];cells[1]=[null,'w-pawn',null,'w-pawn',null];cells[3]=[null,'b-pawn',null,'b-pawn',null];cells[4]=['b-silver','b-gold','b-bishop','b-rook','b-king'];render()">Reiniciar</button>
      <button class="gbtn" onclick="shoEnd()">Debriefing →</button>
    </div>`;
    window.shoC=(r,c)=>{
      if(!sel){if(cells[r][c]&&cells[r][c][0]===turn){sel=[r,c];}render();return;}
      const[sr,sc]=sel;if(r===sr&&c===sc){sel=null;render();return;}
      if(cells[r][c]&&cells[r][c][0]===turn){sel=[r,c];render();return;}
      if(cells[r][c]&&cells[r][c][0]!==turn){
        const[cc2,ct]=cells[r][c].split('-');cap[turn].push(turn+'-'+ct);
      }
      cells[r][c]=cells[sr][sc];cells[sr][sc]=null;sel=null;turn=turn==='b'?'w':'b';render();
    };
    window.shoEnd=()=>{
      gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Análisis de la partida</h2></div>
      <div class="sgrid"><div class="sb"><div class="sbn">${cap.b.length}</div><div class="sbl">Capturas ⚫</div></div><div class="sb"><div class="sbn">${cap.w.length}</div><div class="sbl">Capturas ⚪</div></div></div>`;
      debrf(gc2(),['¿Cuándo prefirieron capturar vs. posicionarse?','¿Usaron piezas capturadas del oponente?','¿Qué significa en el trabajo real "reutilizar el talento del oponente"?']);
    };
  }
  render();
};

window.G_mancala=function(){
  let board=[4,4,4,4,4,4,0,4,4,4,4,4,4,0],turn=1;
  function render(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Mancala Estratégico</h2><p>Jugador ${turn} juega. Sembrar semillas pensando varios turnos adelante.</p></div>
    <div style="max-width:440px;margin:0 auto 1.5rem">
      <div style="display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center">
        <div style="background:var(--cnbg);border-radius:var(--r);padding:12px;text-align:center">
          <div style="font-size:10px;color:var(--cn);font-weight:600;margin-bottom:4px">P2</div>
          <div style="font-size:24px;font-weight:600;font-family:'DM Mono',monospace">${board[13]}</div>
        </div>
        <div>
          <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:4px">
            ${[12,11,10,9,8,7].map(i=>`<div onclick="mP(${i-7},2)" style="background:${turn===2?'var(--surf)':'var(--s3)'};border:${turn===2?'1.5px solid var(--bd2)':'1px solid var(--bd)'};border-radius:var(--r);padding:8px 4px;text-align:center;cursor:${turn===2?'pointer':'not-allowed'};opacity:${turn===2?1:0.5}"><div style="font-size:16px;font-weight:600;font-family:'DM Mono',monospace">${board[i]}</div></div>`).join('')}
          </div>
          <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px">
            ${[0,1,2,3,4,5].map(i=>`<div onclick="mP(${i},1)" style="background:${turn===1?'var(--surf)':'var(--s3)'};border:${turn===1?'1.5px solid var(--bd2)':'1px solid var(--bd)'};border-radius:var(--r);padding:8px 4px;text-align:center;cursor:${turn===1?'pointer':'not-allowed'};opacity:${turn===1?1:0.5}"><div style="font-size:16px;font-weight:600;font-family:'DM Mono',monospace">${board[i]}</div></div>`).join('')}
          </div>
        </div>
        <div style="background:var(--csbg);border-radius:var(--r);padding:12px;text-align:center">
          <div style="font-size:10px;color:var(--cs);font-weight:600;margin-bottom:4px">P1</div>
          <div style="font-size:24px;font-weight:600;font-family:'DM Mono',monospace">${board[6]}</div>
        </div>
      </div>
    </div>
    <div class="gcard"><h3>Principio del Mancala</h3><p style="font-size:14px;color:var(--tm);line-height:1.6">Cada movimiento afecta <strong>múltiples posiciones simultáneamente</strong>. La planificación anticipada supera la reacción eficiente.</p></div>
    <div class="grow">
      <button class="gbtn gbo" onclick="board=[4,4,4,4,4,4,0,4,4,4,4,4,4,0];turn=1;render()">Reiniciar</button>
      <button class="gbtn" onclick="mEnd()">Terminar →</button>
    </div>`;
    window.mP=(pit,player)=>{
      if(player!==turn)return;const idx=player===1?pit:pit+7;if(board[idx]===0)return;
      let seeds=board[idx];board[idx]=0;let pos=idx;
      while(seeds>0){pos=(pos+1)%14;if(player===1&&pos===13)continue;if(player===2&&pos===6)continue;board[pos]++;seeds--;}
      const extra=(player===1&&pos===6)||(player===2&&pos===13);
      if(!extra)turn=turn===1?2:1;
      const p1e=board.slice(0,6).every(v=>v===0),p2e=board.slice(7,13).every(v=>v===0);
      if(p1e||p2e){board[6]+=board.slice(0,6).reduce((a,b)=>a+b,0);board[13]+=board.slice(7,13).reduce((a,b)=>a+b,0);for(let i=0;i<6;i++){board[i]=0;board[i+7]=0;}mEnd();return;}
      render();
    };
    window.mEnd=()=>{
      gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>${board[6]>board[13]?'🏆 Jugador 1 gana':board[13]>board[6]?'🏆 Jugador 2 gana':'🤝 Empate'}</h2></div>
      <div class="sgrid"><div class="sb"><div class="sbn" style="color:var(--cs)">${board[6]}</div><div class="sbl">Jugador 1</div></div><div class="sb"><div class="sbn" style="color:var(--cn)">${board[13]}</div><div class="sbl">Jugador 2</div></div></div>`;
      debrf(gc2(),['¿En qué momentos planificaron más de un turno adelante?','¿Cuándo sacrificaron una posición para ganar otra?','¿Qué analogía tiene la siembra de semillas con la gestión de recursos?']);
    };
  }
  render();
};

window.G_beer=function(){
  let wk=1,tot=8;
  let F={inv:200,prod:20},D={inv:50},W={inv:50},R={inv:50};
  let bk={f:0,d:0,w:0,r:0},hist=[];
  const dem=[4,4,4,4,8,8,8,8];
  let ord={r:4,w:4,d:4};
  function render(){
    if(wk>tot){renderEnd();return;}
    const d=dem[wk-1];
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Beer Distribution Game</h2><p>Semana ${wk}/${tot}. Cada eslabón decide cuánto pedir al eslabón anterior sin saber la demanda real.</p></div>
    ${wk===5?`<div class="gal gd">📣 La demanda del consumidor subió de 4 a 8 unidades esta semana. Solo el minorista lo sabe.</div>`:''}
    <div class="gcard"><h3>Estado de la cadena</h3>
    ${[{n:'🏭 Fábrica',inv:F.inv,bk:bk.f},{n:'🚚 Distribuidor',inv:D.inv,bk:bk.d},{n:'🏪 Mayorista',inv:W.inv,bk:bk.w},{n:'🛒 Minorista',inv:R.inv,bk:bk.r,dem:d}].map(node=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)">
      <div style="min-width:90px;font-size:13px;font-weight:600">${node.n}</div>
      <div style="flex:1">
        <div class="pb2" style="margin-bottom:3px"><div class="pf" style="width:${Math.min(100,node.inv/200*100)}%;background:${node.inv>30?'#00A651':node.inv>10?'#C06000':'#B8003A'}"></div></div>
        <div style="font-size:11px;color:var(--tf)">Inv: ${node.inv} | Backorders: ${node.bk}${node.dem?` | Demanda: ${node.dem}`:''}</div>
      </div>
    </div>`).join('')}</div>
    <div class="gcard"><h3>Decide cuánto pedir</h3>
    ${['r','w','d'].map(n=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <label style="font-size:13px;min-width:110px">${n==='r'?'🛒 Minorista':n==='w'?'🏪 Mayorista':'🚚 Distribuidor'} pide:</label>
      <input type="number" min="0" max="50" value="${ord[n]}" id="o${n}" style="width:65px;padding:6px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:14px;background:var(--s2)">
      <span style="font-size:11px;color:var(--tf)">unidades</span>
    </div>`).join('')}</div>
    <div class="grow"><button class="gbtn" onclick="beerAdv()">Siguiente semana →</button></div>`;
    window.beerAdv=()=>{
      ord.r=parseInt(document.getElementById('or').value)||4;
      ord.w=parseInt(document.getElementById('ow').value)||4;
      ord.d=parseInt(document.getElementById('od').value)||4;
      const dd=dem[wk-1];
      const rs=Math.min(R.inv,dd);R.inv-=rs;bk.r+=dd-rs;
      const ws=Math.min(W.inv,ord.r);W.inv-=ws;R.inv+=ws;bk.w+=ord.r-ws;
      const ds=Math.min(D.inv,ord.w);D.inv-=ds;W.inv+=ds;bk.d+=ord.w-ds;
      const fs=Math.min(F.inv,ord.d);F.inv-=fs;D.inv+=fs;F.inv+=F.prod;
      hist.push({wk,ord:{...ord}});wk++;render();
    };
  }
  function renderEnd(){
    gc2().innerHTML=`<div class="gwr"><div class="gh"><h2>Análisis del efecto látigo</h2>
    <p>Un aumento de demanda de 4→8 unidades causó distorsiones progresivas aguas arriba.</p></div>
    <div class="sgrid">
      ${[{n:'🏭',inv:F.inv,bk:bk.f},{n:'🚚',inv:D.inv,bk:bk.d},{n:'🏪',inv:W.inv,bk:bk.w},{n:'🛒',inv:R.inv,bk:bk.r}].map(x=>`<div class="sb"><div class="sbn" style="color:${x.bk===0?'var(--cs)':'var(--ca)'}">${x.inv}</div><div class="sbl">${x.n} Inventario</div>${x.bk>0?`<div style="font-size:11px;color:var(--ca)">+${x.bk} backorders</div>`:''}</div>`).join('')}
    </div>`;
    debrf(gc2(),['¿Por qué cada eslabón sobreordenó cuando la demanda subió?','¿Qué información no tenían y cómo los afectó?','¿Cómo se manifiesta el efecto látigo en su cadena de valor?','¿Qué cambio en comunicación entre eslabones lo hubiera evitado?']);
  }
  render();
};

  storm:{title:'⛈ Tormenta repentina',body:'Una tormenta imprevista reduce la visibilidad a 5 metros. El equipo tiene 10 minutos para decidir si acampa o fuerza el descenso. Moral −10, salud −5 en todos.',effect:()=>{applyToAll('health',-5);applyToAll('morale',-10);logEvent('EVENTO: Tormenta repentina','bad')}},

let currentDay=0, timerInterval=null, secsLeft=3600, outcomeApplied=false;

function startGame(){
  showScreen('game');
  renderDots(); renderTeam(); renderResources(); renderDay(0); startClock();
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}
function startClock(){
  secsLeft=3600;
  timerInterval=setInterval(()=>{
    secsLeft--;
    const m=Math.floor(secsLeft/60),s=secsLeft%60;
    const el=document.getElementById('clock');
    if(!el){clearInterval(timerInterval);return;}
    el.textContent=m+':'+String(s).padStart(2,'0');
    el.className='clock'+(secsLeft<=300?' urgent':'');
    if(secsLeft<=0) clearInterval(timerInterval);
  },1000);
}
function renderDots(){
  const c=document.getElementById('day-dots');if(!c)return;c.innerHTML='';
  for(let i=0;i<6;i++){
    const d=document.createElement('div');
    d.className='day-dot'+(i<currentDay?' done':i===currentDay?' current':'');
    c.appendChild(d);
  }
}
function renderTeam(){
  const c=document.getElementById('team-cards');if(!c)return;c.innerHTML='';
  TEAM.forEach(m=>{
    const h=Math.max(0,m.health),mo=Math.max(0,m.morale);
    const hc=h>=70?'fill-health':h>=40?'fill-health mid':'fill-health low';
    const hcolor=h<40?'#8B2020':h<70?'#8A5800':'#1A6B3C';
    c.innerHTML+=`<div class="member-card" style="border-left:3px solid ${m.color}">
      <div class="member-header">
        <div class="member-avatar" style="background:${m.color}18">${m.emoji}</div>
        <div><div class="member-name">${m.name}</div><div class="member-role">${m.role}</div></div>
      </div>
      <div class="stat-row"><span class="stat-label">Salud</span><div class="stat-bar"><div class="${hc}" style="width:${h}%"></div></div><span class="stat-val" style="color:${hcolor}">${h}</span></div>
      <div class="stat-row"><span class="stat-label">Moral</span><div class="stat-bar"><div class="stat-fill fill-morale" style="width:${mo}%"></div></div><span class="stat-val" style="color:#1A4A8A">${mo}</span></div>
    </div>`;
  });
}
function renderResources(){
  if(!document.getElementById('resources-display'))return;
  const avgH=Math.round(TEAM.reduce((a,m)=>a+m.health,0)/TEAM.length);
  const avgM=Math.round(TEAM.reduce((a,m)=>a+m.morale,0)/TEAM.length);
  const ox=Math.max(0,100-currentDay*15),food=Math.max(0,100-currentDay*14);
  document.getElementById('resources-display').innerHTML=`
    <div class="resource-row"><span class="res-name">Salud media</span><span class="res-val ${avgH>=70?'good':avgH>=40?'warn':'bad'}">${avgH}%</span></div>
    <div class="resource-row"><span class="res-name">Moral media</span><span class="res-val ${avgM>=70?'good':avgM>=40?'warn':'bad'}">${avgM}%</span></div>
    <div class="resource-row"><span class="res-name">Oxígeno</span><span class="res-val ${ox>=50?'good':ox>=25?'warn':'bad'}">${ox}%</span></div>
    <div class="resource-row"><span class="res-name">Víveres</span><span class="res-val ${food>=50?'good':food>=25?'warn':'bad'}">${food}%</span></div>
    <div class="resource-row"><span class="res-name">Días restantes</span><span class="res-val warn">${6-currentDay}</span></div>`;
}
function renderDay(idx){
  outcomeApplied=false;
  const day=DAYS[idx];
  document.getElementById('team-marker').setAttribute('cx',day.markerX);
  document.getElementById('team-marker').setAttribute('cy',day.markerY);
  document.getElementById('marker-label').setAttribute('x',day.markerX);
  document.getElementById('marker-label').setAttribute('y',day.markerY-13);
  document.getElementById('marker-label').textContent=day.markerLabel;
  const wc=day.weather==='good'?'weather-good':day.weather==='warn'?'weather-warn':'weather-bad';
  const tensions=day.tensions.map(t=>`<div class="tension-item"><span class="tension-role">${t.role}</span><span>${t.text}</span></div>`).join('');
  const outcomes=day.outcomes.map((o,i)=>`<button class="outcome-btn ${o.type}" onclick="applyOutcome(${idx},${i})"><div class="ob-label">${o.label}</div><div class="ob-text">${o.text}</div></button>`).join('');
  document.getElementById('day-content').innerHTML=`
    <div class="day-header"><div><div class="day-title">${day.title}</div></div><div class="day-meta">Altitud: ${day.altitude}</div></div>
    <div class="weather-badge ${wc}">${day.weatherLabel}</div>
    <div class="scenario-box">${day.scenario}</div>
    <div class="dilemma-box"><div class="dilemma-label">Dilema del día</div><div class="dilemma-text">${day.dilemma}</div></div>
    <div class="tensions-section"><div class="panel-label" style="margin-bottom:10px">Tensiones en el equipo</div>${tensions}</div>
    <div class="outcome-section">
      <div class="outcome-label">El equipo decide</div>
      <div class="outcomes-grid">${outcomes}</div>
      <button class="btn-next" id="btn-next" onclick="nextDay()" disabled>Avanzar al siguiente día →</button>
    </div>`;
}
function applyOutcome(di,oi){
  if(outcomeApplied)return;outcomeApplied=true;
  DAYS[di].outcomes[oi].effect();renderTeam();renderResources();
  document.getElementById('btn-next').disabled=false;
}
function nextDay(){
  currentDay++;
  if(currentDay>=6){endGame();return;}
  renderDots();renderDay(currentDay);
}
function endGame(){
  clearInterval(timerInterval);
  const avgH=Math.round(TEAM.reduce((a,m)=>a+m.health,0)/TEAM.length);
  const avgM=Math.round(TEAM.reduce((a,m)=>a+m.morale,0)/TEAM.length);
  const ok=avgH>=50&&avgM>=40;
  document.getElementById('final-title').textContent=ok?'🏔 Misión completada':'⛰ Expedición terminada';
  document.getElementById('final-sub').textContent=ok
    ?`El equipo llegó a la cima y regresó con vida. Salud media: ${avgH}% · Moral: ${avgM}%. Eso es liderazgo real.`
    :`La expedición concluyó pero el equipo pagó un precio alto. Salud: ${avgH}% · Moral: ${avgM}%. ¿Qué falló?`;
  document.getElementById('final-scores').innerHTML=TEAM.map(m=>`
    <div class="fscore-card">
      <div class="fscore-emoji">${m.emoji}</div>
      <div class="fscore-name">${m.name}</div>
      <div class="fscore-val" style="color:${m.health>=70?'#1A6B3C':m.health>=40?'#8A5800':'#8B2020'}">${m.health}%</div>
    </div>`).join('');
  showScreen('final');
}
function triggerEvent(key){
  const ev=EVENTS[key];
  document.getElementById('modal-title').textContent=ev.title;
  document.getElementById('modal-body').textContent=ev.body;
  document.getElementById('modal').classList.add('open');
  ev.effect();renderTeam();renderResources();
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function applyToAll(stat,delta){TEAM.forEach(m=>{m[stat]=Math.min(100,Math.max(0,m[stat]+delta));});}
function applyOne(id,stat,delta){const m=TEAM.find(t=>t.id===id);if(m)m[stat]=Math.min(100,Math.max(0,m[stat]+delta));}
function logEvent(text,type=''){
  const log=document.getElementById('event-log');
  const item=document.createElement('div');
  item.className='log-item '+(type||'');
  item.innerHTML=`<span class="log-day">D${currentDay+1}</span>${text}`;
  log.prepend(item);
}
function restartGame(){
  TEAM.forEach(m=>{m.health=100;m.morale=100;});
  currentDay=0;document.getElementById('event-log').innerHTML='';
  startGame();
}
    // Expose to global scope for onclick handlers
    window.startGame = startGame;
    window.restartGame = restartGame;
    window.applyOutcome = applyOutcome;
    window.nextDay = nextDay;
    window.triggerEvent = triggerEvent;
    window.closeModal = closeModal;
    window.showScreen = showScreen;
  })();
};
