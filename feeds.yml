name: Mundial26 feeds

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # permite ejecutarlo a mano

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar feeds
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # WC_LEAGUE_ID: "1"     # opcional, si el id del Mundial cambia
          # WC_SEASON: "2026"     # opcional
        run: node fetch-feeds.js

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add goleadores.json marcadores.json noticias.json
          git commit -m "feeds: goleo/marcadores/noticias" || echo "sin cambios"
          git push
